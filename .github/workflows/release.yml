name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Extract version from tag
      id: get_version
      run: |
        # Extract version from tag (e.g., v0.13.0 -> 0.13.0)
        VERSION="${GITHUB_REF#refs/tags/v}"
        # Validate that version was extracted
        if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
          echo "Error: Tag must start with 'v' (e.g., v0.13.0)"
          exit 1
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
      
    - name: Restore dependencies
      run: dotnet restore CoreEssentials/CoreEssentials.csproj
      
    - name: Build
      run: dotnet build CoreEssentials/CoreEssentials.csproj --no-restore -c Release
      
    - name: Pack
      run: dotnet pack CoreEssentials/CoreEssentials.csproj --no-build -c Release
      
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push CoreEssentials/bin/Release/CoreEssentials-MonoGame.${{ steps.get_version.outputs.VERSION }}.nupkg \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          CoreEssentials/bin/Release/*.nupkg
          CoreEssentials/bin/Release/*.snupkg
        generate_release_notes: true
        name: Release ${{ steps.get_version.outputs.VERSION }}
