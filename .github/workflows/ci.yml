name: Build and Test

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore CoreEssentials/CoreEssentials.csproj
      
    - name: Build
      run: dotnet build CoreEssentials/CoreEssentials.csproj --no-restore -c Release
      
    - name: Pack (verify packaging works)
      run: dotnet pack CoreEssentials/CoreEssentials.csproj --no-build -c Release
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: |
          CoreEssentials/bin/Release/CoreEssentials-MonoGame.*.nupkg
          CoreEssentials/bin/Release/CoreEssentials-MonoGame.*.snupkg
        retention-days: 7
        if-no-files-found: error
        
  test:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore local tools (mgcb)
      run: |
        # Restore the MGCB local tool manifests sequentially, before the build.
        # Without this, the per-project `dotnet tool restore` calls triggered by
        # MonoGame.Content.Builder.Task run in parallel on a fresh runner and race
        # on extracting dotnet-mgcb from the NuGet cache (file lock -> MSB3073).
        foreach ($dir in @('CoreEssentials', 'CoreEssentials.Playground', 'CoreEssentials.Tests')) {
          Push-Location $dir
          dotnet tool restore
          Pop-Location
        }

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test
      run: dotnet test CoreEssentials.Tests/ --no-build -c Release --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: CoreEssentials.Tests/TestResults/*.trx
        retention-days: 7
